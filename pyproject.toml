[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-gva"
version = "0.1.0"
description = "Triton kernels for Grouped Value Attention (GVA): prefill and decode"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "triton; sys_platform == 'linux'",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["flash_gva"]
